[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-monster-kart"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smk = "smk.app.main:main"

[tool.setuptools.packages.find]
include = ["smk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the dev tooling in tools/, which is not an installed package.
pythonpath = ["."]
